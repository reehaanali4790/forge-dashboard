name: CI and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: forge-dashboard-deploy
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest -v test_market test_psx test_commodities test_lcd

  deploy:
    name: Deploy on VPS
    needs: test
    runs-on: [self-hosted, forge-vps]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Sync into /opt/forge-dashboard
        run: |
          set -euo pipefail
          sudo mkdir -p /opt/forge-dashboard
          sudo rsync -a --delete \
            --exclude '.git' \
            --exclude '.cache' \
            --exclude '__pycache__' \
            --exclude '.env' \
            --exclude '.github' \
            ./ /opt/forge-dashboard/
          if [[ ! -f /opt/forge-dashboard/.env ]]; then
            sudo cp /opt/forge-dashboard/.env.example /opt/forge-dashboard/.env || sudo touch /opt/forge-dashboard/.env
          fi
          sudo chmod +x /opt/forge-dashboard/deploy/remote-deploy.sh

      - name: Build and restart forge-dashboard only
        run: sudo /opt/forge-dashboard/deploy/remote-deploy.sh

      - name: Local smoke check
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            code=$(curl -fsS -o /tmp/forge-smoke.html -w '%{http_code}' http://127.0.0.1:3200/ || true)
            if [[ "$code" == "200" ]] && grep -qi 'forge' /tmp/forge-smoke.html; then
              echo "Smoke OK on :3200"
              curl -fsS -o /dev/null -w 'psx:%{http_code}\n' http://127.0.0.1:3200/psx
              curl -fsS -o /dev/null -w 'lcd:%{http_code}\n' http://127.0.0.1:3200/lcd
              curl -fsS -o /tmp/forge-lcd.json -w 'lcd-api:%{http_code}\n' http://127.0.0.1:3200/api/lcd/overview
              grep -q '"futures"' /tmp/forge-lcd.json
              exit 0
            fi
            sleep 2
          done
          docker compose -p forge-dashboard ps || true
          docker compose -p forge-dashboard logs --tail=80 forge || true
          exit 1
