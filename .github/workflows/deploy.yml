name: CI and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: forge-dashboard-deploy
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest -v test_market test_psx test_commodities

  deploy:
    name: Deploy to VPS
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Start ssh-agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host forge-vps
            HostName ${DEPLOY_HOST}
            User ${{ secrets.DEPLOY_USER }}
            IdentitiesOnly yes
            ServerAliveInterval 15
            ServerAliveCountMax 6
            ConnectTimeout 30
          EOF
          chmod 600 ~/.ssh/config

      - name: Sync app to /opt/forge-dashboard
        run: |
          set -euo pipefail
          ssh forge-vps 'mkdir -p /opt/forge-dashboard'
          tar -czf - \
            --exclude='.git' \
            --exclude='.cache' \
            --exclude='__pycache__' \
            --exclude='.env' \
            --exclude='.github' \
            --exclude='*.pyc' \
            . | ssh forge-vps 'tar -xzf - -C /opt/forge-dashboard'

      - name: Remote build and restart
        run: |
          set -euo pipefail
          ssh forge-vps 'chmod +x /opt/forge-dashboard/deploy/remote-deploy.sh && /opt/forge-dashboard/deploy/remote-deploy.sh'

      - name: Smoke check from runner
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            if curl -fsS "http://${DEPLOY_HOST}:3200/" | head -c 200 | grep -qi forge; then
              echo "Public smoke OK on :3200"
              exit 0
            fi
            sleep 3
          done
          echo "Public smoke failed" >&2
          exit 1
