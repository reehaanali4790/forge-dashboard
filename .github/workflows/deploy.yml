name: CI and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: forge-dashboard-deploy
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest -v test_market test_psx test_commodities

  deploy:
    name: Deploy to VPS
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Start ssh-agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add server host key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync app to /opt/forge-dashboard
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          rsync -az --delete \
            --exclude '.git' \
            --exclude '.cache' \
            --exclude '__pycache__' \
            --exclude '.env' \
            --exclude '.github' \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/forge-dashboard/"

      - name: Remote build and restart
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'chmod +x /opt/forge-dashboard/deploy/remote-deploy.sh && /opt/forge-dashboard/deploy/remote-deploy.sh'

      - name: Smoke check from runner
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            if curl -fsS "http://${DEPLOY_HOST}:3200/" | head -c 200 | grep -qi forge; then
              echo "Public smoke OK on :3200"
              exit 0
            fi
            sleep 3
          done
          echo "Public smoke failed" >&2
          exit 1
