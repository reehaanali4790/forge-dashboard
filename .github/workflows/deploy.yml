name: CI and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: forge-dashboard-deploy
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest -v test_market test_psx test_commodities

  deploy:
    name: Deploy on VPS
    needs: test
    runs-on: [self-hosted, forge-vps]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Sync into /opt/forge-dashboard
        run: |
          set -euo pipefail
          sudo mkdir -p /opt/forge-dashboard
          sudo rsync -a --delete \
            --exclude '.git' \
            --exclude '.cache' \
            --exclude '__pycache__' \
            --exclude '.env' \
            --exclude '.github' \
            ./ /opt/forge-dashboard/
          if [[ ! -f /opt/forge-dashboard/.env ]]; then
            sudo cp /opt/forge-dashboard/.env.example /opt/forge-dashboard/.env || sudo touch /opt/forge-dashboard/.env
          fi
          sudo chmod +x /opt/forge-dashboard/deploy/remote-deploy.sh

      - name: Build and restart forge-dashboard only
        run: sudo /opt/forge-dashboard/deploy/remote-deploy.sh

      - name: Local smoke check
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3200/ | head -c 200 | grep -qi forge; then
              echo "Smoke OK on :3200"
              exit 0
            fi
            sleep 2
          done
          exit 1
