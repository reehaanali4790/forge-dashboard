<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Forge wall board — PSX charts, China futures, metals, FOB, vessels.">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/lcd.css">
  <script src="/theme.js"></script>
  <script src="/lcd.js" defer></script>
  <title>Forge</title>
</head>
<body class="wall">
  <header class="topbar">
    <a href="/" class="brand">Forge</a>
    <div class="clock-block">
      <time id="wall-date">—</time>
      <time id="wall-time">—</time>
      <span id="wall-meridiem"></span>
      <span class="tz">PKT</span>
    </div>
    <div class="feeds" id="feed-dots">
      <span class="feed" data-feed="psx"><i class="status-dot loading"></i>PSX</span>
      <span class="feed" data-feed="futures"><i class="status-dot loading"></i>Futures</span>
      <span class="feed" data-feed="metals"><i class="status-dot loading"></i>Metals</span>
      <span class="feed" data-feed="fob"><i class="status-dot loading"></i>FOB</span>
      <span class="feed" data-feed="vessels"><i class="status-dot loading"></i>Vessels</span>
      <button class="theme-toggle wall-theme" type="button" data-action="theme" aria-label="Switch colour theme">
        <svg class="icon ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.3A8.5 8.5 0 0 1 9.7 3.5a8.5 8.5 0 1 0 10.8 10.8Z"/></svg>
        <svg class="icon ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.2M12 19.2v2.2M4.2 12H2M22 12h-2.2M6.4 6.4 4.9 4.9M19.1 19.1l-1.5-1.5M17.6 6.4l1.5-1.5M4.9 19.1l1.5-1.5"/></svg>
      </button>
    </div>
  </header>

  <div class="ticker" aria-label="Market wire">
    <div class="ticker-track" id="ticker-track"><span>Loading wire…</span></div>
  </div>

  <main class="board">
    <section class="zone zone-psx pane" aria-label="PSX charts">
      <header class="zone-head">
        <h2>PSX charts</h2>
        <div class="breadth" id="psx-breadth"></div>
        <span class="live" id="psx-state">sync</span>
      </header>
      <div class="chart-grid" id="psx-charts"></div>
      <footer class="ledger" id="psx-ledger"></footer>
    </section>

    <section class="zone zone-fut pane" aria-label="China futures and rates">
      <header class="zone-head">
        <h2>China futures &amp; FX</h2>
        <span class="live" id="fut-state">sync</span>
      </header>
      <div class="chart-grid five" id="fut-charts"></div>
    </section>

    <section class="zone zone-rates" aria-label="Metals, FOB and freight">
      <article class="pane rate-pane" id="metals-pane">
        <header class="zone-head"><h2>Gold &amp; crude</h2><span class="live soft">CFD</span></header>
        <div class="rate-grid" id="metals-grid"></div>
      </article>
      <article class="pane rate-pane" id="fob-pane">
        <header class="zone-head"><h2>FOB China</h2><span class="live soft">indicative</span></header>
        <div class="fob-grid" id="fob-products"></div>
      </article>
      <article class="pane rate-pane" id="bdi-pane">
        <header class="zone-head"><h2>Seaway</h2><span class="live" id="bdi-live">BDI</span></header>
        <div id="bdi-panel"></div>
        <p class="note" id="fob-disclaimer">Indicative · not settlement</p>
      </article>
    </section>

    <section class="zone zone-ops" aria-label="Vessels and wire">
      <div class="vessel-band" id="vessel-band">
        <article class="pane vessel-pane" id="col-arrived">
          <header class="zone-head"><h2>Arrived</h2><span class="count" id="count-arrived">0</span></header>
          <div class="vessels" id="list-arrived"></div>
        </article>
        <article class="pane vessel-pane" id="col-transit">
          <header class="zone-head"><h2>In transit</h2><span class="count" id="count-transit">0</span></header>
          <div class="vessels" id="list-transit"></div>
        </article>
        <article class="pane vessel-pane" id="col-booked">
          <header class="zone-head"><h2>Booked</h2><span class="count" id="count-booked">0</span></header>
          <div class="vessels" id="list-booked"></div>
        </article>
      </div>
      <article class="pane wire-pane" id="col-news">
        <header class="zone-head"><h2>Wire</h2><span class="live" id="wire-pulse">live</span></header>
        <ul class="wire" id="news-wire"></ul>
      </article>
    </section>
  </main>
</body>
</html>
