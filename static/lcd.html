<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e8eef6">
  <meta name="description" content="Forge wall board — PSX, futures, FOB/BDI, TradeDeck vessels.">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/lcd.css">
  <script src="/lcd.js" defer></script>
  <title>Forge</title>
</head>
<body>
  <div class="sky" aria-hidden="true">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
    <div class="sheen"></div>
  </div>

  <header class="topbar">
    <a href="/" class="brand">Forge</a>
    <div class="clock-block">
      <time id="wall-date">—</time>
      <time id="wall-time">—</time>
      <span class="tz">Pakistan</span>
    </div>
    <div class="feeds" id="feed-dots">
      <span class="feed" data-feed="psx"><i class="dot loading"></i>PSX</span>
      <span class="feed" data-feed="futures"><i class="dot loading"></i>Futures</span>
      <span class="feed" data-feed="fob"><i class="dot loading"></i>FOB</span>
      <span class="feed" data-feed="vessels"><i class="dot loading"></i>Vessels</span>
    </div>
  </header>

  <div class="ticker" aria-label="Market wire">
    <div class="ticker-track" id="ticker-track">
      <span>Loading market wire…</span>
    </div>
  </div>

  <main class="board">
    <section class="band markets" aria-label="Markets">
      <article class="pane pane-psx" id="card-psx">
        <header class="pane-head">
          <h2>PSX momentum</h2>
          <span class="live" id="psx-state">sync</span>
        </header>
        <div class="breadth" id="psx-breadth"></div>
        <ol class="mom" id="psx-mom"></ol>
        <div class="spark" id="psx-spark" aria-hidden="true"></div>
        <footer class="ledger" id="psx-ledger"></footer>
      </article>

      <article class="pane pane-fut" id="card-futures">
        <header class="pane-head">
          <h2>China futures</h2>
          <span class="live" id="fut-state">sync</span>
        </header>
        <div class="fut-rail" id="fut-grid"></div>
      </article>

      <article class="pane pane-fob" id="card-fob">
        <header class="pane-head">
          <h2>FOB &amp; seaway</h2>
          <span class="live soft">indicative</span>
        </header>
        <div class="fob-stack" id="fob-products"></div>
        <div class="bdi" id="bdi-panel"></div>
        <p class="note" id="fob-disclaimer">Indicative scrape · not settlement</p>
      </article>
    </section>

    <section class="band ops" aria-label="Vessels and wire">
      <div class="vessel-band" id="vessel-band">
        <article class="pane pane-vessel" id="col-arrived" data-col="0">
          <header class="pane-head">
            <h2>Arrived</h2>
            <span class="count" id="count-arrived">0</span>
          </header>
          <div class="vessels" id="list-arrived"></div>
        </article>
        <article class="pane pane-vessel" id="col-transit" data-col="1">
          <header class="pane-head">
            <h2>In transit</h2>
            <span class="count" id="count-transit">0</span>
          </header>
          <div class="vessels" id="list-transit"></div>
        </article>
        <article class="pane pane-vessel" id="col-booked" data-col="2">
          <header class="pane-head">
            <h2>Booked</h2>
            <span class="count" id="count-booked">0</span>
          </header>
          <div class="vessels" id="list-booked"></div>
        </article>
      </div>
      <article class="pane pane-wire" id="col-news">
        <header class="pane-head">
          <h2>Wire</h2>
          <span class="live" id="wire-pulse">live</span>
        </header>
        <ul class="wire" id="news-wire"></ul>
      </article>
    </section>
  </main>
</body>
</html>
